name: "[♻️Reusable] Check affected sources"

on:
  workflow_call:
    inputs:
      tooling:
        type: boolean
        required: true
      app:
        type: boolean
        required: true
      engine:
        type: boolean
        required: true

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      CODEX_REPO_ROOT: ${{ github.workspace }}/engine
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        if: ${{ inputs.engine || inputs.tooling }}
        with:
          toolchain: "1.95.0"
          components: rustfmt

      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: just@1.51.0

      - name: Install the verified actionlint executable
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --silent --show-error --proto '=https' --max-time 60 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.11/actionlint_1.7.11_darwin_arm64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' a21ba7366d8329e7223faee0ed69eb13da27fe8acabb356bb7eb0b7f1e1cb6d8 "$archive" | shasum -a 256 -c -
          mkdir "$RUNNER_TEMP/actionlint"
          tar -xzf "$archive" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"

      - uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2
        if: ${{ inputs.engine }}

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.3"

      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: "10.34.5"
          run_install: false

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22

      - name: Install formatting dependencies
        run: pnpm --dir engine install --frozen-lockfile

      - name: Check tooling and documentation formatting
        run: python3 scripts/format.py --scope tooling --check

      - name: Check Swift formatting
        if: ${{ inputs.app }}
        run: python3 scripts/format.py --scope app --check

      - name: Check Engine formatting
        if: ${{ inputs.engine }}
        run: python3 scripts/format.py --scope engine --check

      - name: Check GitHub Actions workflows
        run: just lint-workflows

      - name: Check Markdown
        run: just lint-docs

      - name: Verify Engine source policies
        if: ${{ inputs.engine }}
        run: |
          python3 engine/.github/scripts/verify_cargo_workspace_manifests.py
          python3 engine/.github/scripts/verify_tui_core_boundary.py
          python3 engine/.github/scripts/verify_bazel_clippy_lints.py
          python3 engine/scripts/asciicheck.py engine/README.md
          python3 engine/scripts/readme_toc.py engine/README.md

      - name: Test product tooling
        if: ${{ inputs.tooling }}
        run: |
          just metadata-check
          just test-tools

      - name: Build the app
        if: ${{ inputs.app }}
        run: |
          swift --version
          xcodebuild -version
          swift build --package-path app -c release --jobs 2

      - name: Test the app
        if: ${{ inputs.app }}
        timeout-minutes: 5
        run: swift test --package-path app --jobs 2 --verbose

      - name: Fetch the pinned official ChatGPT app for routing verification
        if: ${{ inputs.app }}
        run: python3 scripts/official_app.py download "$RUNNER_TEMP/official/ChatGPT.app"

      - name: Verify routing with official Code Mode and approvals
        if: ${{ inputs.app }}
        run: |
          python3 scripts/verify_official_runtime.py "$RUNNER_TEMP/official/ChatGPT.app" \
            "$GITHUB_WORKSPACE/app/.build/release/CodexTurnrailRouter" "$RUNNER_TEMP/runtime-verification.json" --ci

      - name: Retain runtime verification
        if: ${{ inputs.app }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: official-engine-routing
          path: ${{ runner.temp }}/runtime-verification.json
          if-no-files-found: error

      - name: Check packaging scripts and metadata
        if: ${{ inputs.tooling || inputs.app }}
        run: |
          zsh -n scripts/build-app.sh
          zsh -n scripts/verify-protocol-compatibility.sh
          plutil -lint packaging/Info.plist

      - name: Check for a clean worktree
        if: ${{ always() && !cancelled() }}
        uses: ./engine/.github/actions/check-clean-worktree
