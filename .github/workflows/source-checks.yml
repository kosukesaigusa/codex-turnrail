name: Source and app checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      CODEX_REPO_ROOT: ${{ github.workspace }}/engine
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: "1.95.0"
          components: rustfmt

      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: just@1.51.0

      - uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.3"

      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: "10.34.5"
          run_install: false

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22

      - name: Install formatting dependencies
        run: pnpm --dir engine install --frozen-lockfile

      - name: Check all source formatting
        run: just fmt-check

      - name: Check Markdown
        run: just lint-docs

      - name: Verify Engine source policies
        run: |
          python3 engine/.github/scripts/verify_cargo_workspace_manifests.py
          python3 engine/.github/scripts/verify_tui_core_boundary.py
          python3 engine/.github/scripts/verify_bazel_clippy_lints.py
          python3 engine/scripts/asciicheck.py engine/README.md
          python3 engine/scripts/readme_toc.py engine/README.md

      - name: Test product tooling
        run: |
          just metadata-check
          just test-tools

      - name: Build and test the app
        run: |
          swift build --package-path app -c release --jobs 2
          swift test --package-path app --jobs 2

      - name: Check packaging scripts and metadata
        run: |
          zsh -n scripts/build-app.sh
          zsh -n scripts/verify-protocol-compatibility.sh
          plutil -lint packaging/Info.plist packaging/entitlements/codex-code-mode-host.entitlements

      - name: Check for a clean worktree
        if: ${{ always() && !cancelled() }}
        uses: ./engine/.github/actions/check-clean-worktree
