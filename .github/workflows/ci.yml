name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  checks:
    name: Source and app checks
    uses: ./.github/workflows/source-checks.yml

  dependencies:
    name: Dependency policy
    uses: ./.github/workflows/dependency-policy.yml

  spelling:
    name: Spelling
    uses: ./.github/workflows/spelling.yml

  blob-size:
    name: File size policy
    uses: ./.github/workflows/blob-size.yml

  engine-inputs:
    name: Engine inputs
    needs: [checks, dependencies, spelling, blob-size]
    uses: ./.github/workflows/engine-inputs.yml
    with:
      source: ${{ github.sha }}

  engine:
    name: Engine and runtime
    needs: engine-inputs
    uses: ./.github/workflows/engine.yml
    with:
      source: ${{ needs.engine-inputs.outputs.source }}
      identity: ${{ needs.engine-inputs.outputs.identity }}
      key: ${{ needs.engine-inputs.outputs.key }}

  required:
    name: CI required
    if: ${{ always() }}
    needs: [checks, dependencies, spelling, blob-size, engine-inputs, engine]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Require successful dependencies
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/check_ci_results.py
