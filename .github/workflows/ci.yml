name: "[🔍CI] Checks"

on:
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: Full verification or a verified README-only change
        type: choice
        options: [full, readme]
        default: full
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  changes:
    name: Classify CI changes
    runs-on: ubuntu-24.04
    outputs:
      engine_required: ${{ steps.changes.outputs.engine_required }}
      readme_only: ${{ steps.changes.outputs.readme_only }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare committed Engine inputs
        id: changes
        run: |
          python3 scripts/ci_changes.py > "$RUNNER_TEMP/ci-changes"
          cat "$RUNNER_TEMP/ci-changes"
          cat "$RUNNER_TEMP/ci-changes" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/ci-changes" >> "$GITHUB_STEP_SUMMARY"

  checks:
    name: Source and app checks
    needs: changes
    if: ${{ needs.changes.outputs.readme_only == 'false' }}
    uses: ./.github/workflows/source-checks.yml

  dependencies:
    name: Dependency policy
    needs: changes
    if: ${{ needs.changes.outputs.readme_only == 'false' }}
    uses: ./.github/workflows/dependency-policy.yml

  spelling:
    name: Spelling
    needs: changes
    if: ${{ needs.changes.outputs.readme_only == 'false' }}
    uses: ./.github/workflows/spelling.yml

  blob-size:
    name: File size policy
    needs: changes
    if: ${{ needs.changes.outputs.readme_only == 'false' }}
    uses: ./.github/workflows/blob-size.yml

  readme:
    name: README checks
    needs: changes
    if: ${{ needs.changes.outputs.readme_only == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
      - name: Check README formatting and Markdown
        run: |
          npx --yes prettier@3.5.3 --check README.md --config engine/.prettierrc.toml
          npx --yes markdownlint-cli2@0.23.2 --config .markdownlint-cli2.jsonc README.md

  engine-inputs:
    name: Engine inputs
    needs: [changes, checks, dependencies, spelling, blob-size]
    if: ${{ needs.changes.outputs.engine_required == 'true' }}
    uses: ./.github/workflows/engine-inputs.yml
    with:
      source: ${{ github.sha }}

  engine:
    name: Engine and runtime
    needs: engine-inputs
    uses: ./.github/workflows/engine.yml
    with:
      source: ${{ needs.engine-inputs.outputs.source }}
      identity: ${{ needs.engine-inputs.outputs.identity }}
      key: ${{ needs.engine-inputs.outputs.key }}

  required:
    name: CI required
    if: ${{ always() }}
    needs:
      [
        changes,
        checks,
        dependencies,
        spelling,
        blob-size,
        readme,
        engine-inputs,
        engine,
      ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Require successful dependencies
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/check_ci_results.py
