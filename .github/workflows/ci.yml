name: "[🔍CI] Checks"

on:
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: Select checks from changed inputs or explicitly run everything
        type: choice
        options: [auto, full]
        default: auto
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  changes:
    name: Classify CI changes
    runs-on: ubuntu-24.04
    outputs:
      engine_required: ${{ steps.changes.outputs.engine_required }}
      app_required: ${{ steps.changes.outputs.app_required }}
      tooling_required: ${{ steps.changes.outputs.tooling_required }}
      dependencies_required: ${{ steps.changes.outputs.dependencies_required }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Identify affected checks from committed changes
        id: changes
        run: |
          python3 scripts/ci_changes.py > "$RUNNER_TEMP/ci-changes"
          cat "$RUNNER_TEMP/ci-changes"
          cat "$RUNNER_TEMP/ci-changes" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/ci-changes" >> "$GITHUB_STEP_SUMMARY"

  checks:
    name: Source checks
    needs: changes
    uses: ./.github/workflows/source-checks.yml
    with:
      app: ${{ needs.changes.outputs.app_required == 'true' }}
      tooling: ${{ needs.changes.outputs.tooling_required == 'true' }}
      engine: ${{ needs.changes.outputs.engine_required == 'true' }}

  dependencies:
    name: Dependency policy
    needs: changes
    if: ${{ needs.changes.outputs.dependencies_required == 'true' }}
    uses: ./.github/workflows/dependency-policy.yml

  spelling:
    name: Spelling
    uses: ./.github/workflows/spelling.yml

  blob-size:
    name: File size policy
    uses: ./.github/workflows/blob-size.yml

  required:
    name: CI required
    if: ${{ always() }}
    needs: [changes, checks, dependencies, spelling, blob-size]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Require successful dependencies
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/check_ci_results.py
