name: Draft release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: turnrail-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the existing tag and main CI
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$EVENT" in
            push) tag="$REF_NAME" ;;
            workflow_dispatch) tag="$INPUT_TAG" ;;
            *) exit 1 ;;
          esac
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          sha="$(git rev-parse "refs/tags/$tag^{commit}")"
          git merge-base --is-ancestor "$sha" origin/main
          git checkout --detach "$sha"
          python3 scripts/project_metadata.py --tag "$tag"
          python3 - "$sha" <<'PY'
          import os, sys
          sys.path.insert(0, "scripts")
          from release_tag import require_ci
          require_ci(os.environ["GITHUB_REPOSITORY"], sys.argv[1])
          PY
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  package:
    needs: validate
    runs-on: macos-15
    timeout-minutes: 180
    environment: release
    permissions:
      contents: write
      actions: read
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CODEX_REPO_ROOT: ${{ github.workspace }}/engine
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - name: Require signing configuration before building
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
        run: |
          for required_key in CERTIFICATE CERTIFICATE_PASSWORD SIGNING_IDENTITY; do
            if [[ -z "${!required_key}" ]]; then
              echo "$required_key is required in the release environment." >&2
              exit 1
            fi
          done
          case "$SIGNING_IDENTITY" in
            'Developer ID Application: '*) ;;
            *) echo 'A Developer ID Application identity is required.' >&2; exit 1 ;;
          esac
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: "1.95.0"
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: just@1.51.0,cargo-about@0.9.2
      - uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.3"
      - name: Fetch and verify the pinned official CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py download-cli "$RUNNER_TEMP/official-codex"
      - name: Import the signing certificate into an ephemeral keychain
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/signing.p12"
          keychain_path="$RUNNER_TEMP/turnrail-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$certificate_path"
          chmod 600 "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$CERTIFICATE_PASSWORD" -t cert -f pkcs12 -k "$keychain_path" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          rm "$certificate_path"
      - name: Build, sign, and verify the distribution app
        env:
          SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
        run: scripts/build-app.sh "$RUNNER_TEMP/release" "$SIGNING_IDENTITY" "$RUNNER_TEMP/official-codex" release --ci
      - name: Create the verified archive and checksums
        run: python3 scripts/release.py archive "$RUNNER_TEMP/release" "$RELEASE_TAG"
      - name: Create a draft with all artifacts and generated PR notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "release"
          manifest = json.loads((path / "build-manifest.json").read_text())
          app = manifest["upstream"]["app"]
          note = f"Requires Codex {app['version']} ({app['build']}). Source: `{manifest['source_commit']}`.\n\n"
          note += "Signed with " + manifest["signing_authorities"][0] + ". Not notarized.\n\n"
          note += "Download and verify the listed SHA-256 checksums. Maintainers must complete the release checklist before publishing this draft.\n"
          (path / "notes.md").write_text(note)
          PY
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/release/Codex-Turnrail-$RELEASE_TAG-macos-arm64.zip" \
            "$RUNNER_TEMP/release/build-manifest.json" \
            "$RUNNER_TEMP/release/runtime-verification.json" \
            "$RUNNER_TEMP/release/SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "Codex Turnrail $RELEASE_TAG" --generate-notes \
            --notes-file "$RUNNER_TEMP/release/notes.md"
      - name: Remove the signing keychain
        if: ${{ always() }}
        run: |
          if [[ -f "$RUNNER_TEMP/turnrail-signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/turnrail-signing.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/signing.p12"
      - name: Clean generated build files
        if: ${{ always() }}
        run: python3 scripts/dev.py finish
