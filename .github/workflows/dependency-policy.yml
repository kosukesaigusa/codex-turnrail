name: "[♻️Reusable] Check dependencies"

on:
  workflow_call:

permissions:
  contents: read

jobs:
  cargo-deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Check Rust dependency policy
        uses: EmbarkStudios/cargo-deny-action@82eb9f621fbc699dd0918f3ea06864c14cc84246 # v2
        with:
          rust-version: 1.95.0
          manifest-path: ./engine/codex-rs/Cargo.toml
          arguments: --all-features --locked
      - name: Check for a clean worktree
        if: ${{ always() && !cancelled() }}
        uses: ./engine/.github/actions/check-clean-worktree
