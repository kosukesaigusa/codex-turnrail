name: "[♻️Reusable] Build or reuse Engine"

on:
  workflow_call:
    inputs:
      source:
        type: string
        required: true
      identity:
        type: string
        required: true
      key:
        type: string
        required: true
    outputs:
      artifact_id:
        value: ${{ jobs.complete.outputs.artifact_id }}
      producer_run:
        value: ${{ jobs.complete.outputs.producer_run }}

permissions:
  contents: read
  actions: read

# Wait for an identical producer instead of starting another pair of builds.
concurrency:
  group: turnrail-engine-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ inputs.key }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      artifact_id: ${{ steps.plan.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
      - name: Select verified reuse or an explicit new build
        id: plan
        env:
          ENGINE_IDENTITY: ${{ inputs.identity }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/engine_artifacts.py plan > "$RUNNER_TEMP/engine-plan"
          cat "$RUNNER_TEMP/engine-plan"
          cat "$RUNNER_TEMP/engine-plan" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/engine-plan" >> "$GITHUB_STEP_SUMMARY"

  checks:
    needs: plan
    if: ${{ needs.plan.outputs.mode == 'build' }}
    uses: ./.github/workflows/engine-checks.yml
    with:
      source: ${{ inputs.source }}
      identity: ${{ inputs.identity }}
      key: ${{ inputs.key }}

  release:
    needs: plan
    if: ${{ needs.plan.outputs.mode == 'build' }}
    uses: ./.github/workflows/engine-release.yml
    with:
      source: ${{ inputs.source }}
      identity: ${{ inputs.identity }}
      key: ${{ inputs.key }}

  complete:
    name: Seal verified Engine
    if: ${{ always() }}
    needs: [plan, checks, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact_id: ${{ steps.result.outputs.artifact_id }}
      producer_run: ${{ steps.result.outputs.producer_run }}
    env:
      ENGINE_IDENTITY: ${{ inputs.identity }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
      - name: Require every job in the selected Engine plan
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/engine_artifacts.py gate
      - name: Combine successful CI and optimized runtime evidence
        if: ${{ needs.plan.outputs.mode == 'build' }}
        env:
          CHECKS_ID: ${{ needs.checks.outputs.artifact_id }}
          RELEASE_ID: ${{ needs.release.outputs.artifact_id }}
        run: python3 scripts/engine_artifacts.py seal "$CHECKS_ID" "$RELEASE_ID" "$RUNNER_TEMP/verified-engine"
      - name: Retain the verified Engine for CI and distribution
        if: ${{ needs.plan.outputs.mode == 'build' }}
        id: bundle
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: turnrail-engine-${{ inputs.key }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verified-engine
          compression-level: 0
          if-no-files-found: error
          retention-days: 90
      - name: Revalidate the selected reusable Engine
        if: ${{ needs.plan.outputs.mode == 'reuse' }}
        env:
          ARTIFACT_ID: ${{ needs.plan.outputs.artifact_id }}
        run: python3 scripts/engine_artifacts.py restore "$ARTIFACT_ID" "$RUNNER_TEMP/verified-engine"
      - name: Record the verified artifact reference
        id: result
        env:
          MODE: ${{ needs.plan.outputs.mode }}
          BUILT_ID: ${{ steps.bundle.outputs.artifact-id }}
          REUSED_ID: ${{ needs.plan.outputs.artifact_id }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads((Path(os.environ["RUNNER_TEMP"]) / "verified-engine/manifest.json").read_text())
          mode = os.environ["MODE"]
          if mode == "build":
              artifact = os.environ["BUILT_ID"]
          elif mode == "reuse":
              artifact = os.environ["REUSED_ID"]
          else:
              raise SystemExit("Unknown Engine plan.")
          if not artifact.isdigit():
              raise SystemExit("A verified artifact ID is required.")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"artifact_id={artifact}\nproducer_run={manifest['run_id']}\n")
          PY
